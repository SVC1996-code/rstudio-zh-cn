assistantIndexingEnabledDescription=启用后，RStudio 将使用 AI 助手索引项目文件。
assistantNesEnabledTitle=启用下一步编辑建议
assistantNesEnabledDescription=启用后，RStudio 会在可用时显示当前 AI 助手提供的下一步编辑建议。
assistantNesAutoshowTitle=自动在编辑器中显示下一次编辑建议
assistantNesAutoshowDescription=启用后，下一步编辑建议会自动显示；禁用后，仅在鼠标悬停于边栏图标上时显示建议。
editSuggestionDiffGranularityTitle=编辑建议中的更改突出显示方式:
editSuggestionDiffGranularityDescription=控制编辑建议预览中更改内容的突出显示粒度。单词级会标记整个发生变化的单词；字符级会标记发生变化的单个字符。
editSuggestionDiffGranularityEnum_word=单词
editSuggestionDiffGranularityEnum_character=字符
assistantToolbarButtonVisibleTitle=在工具栏中显示 Posit Assistant 按钮
assistantToolbarButtonVisibleDescription=启用后，主工具栏中会显示 Posit Assistant 按钮。
assistantUseSystemCaTitle=使用系统证书存储（需要重启）
assistantUseSystemCaDescription=启用后，AI 助手代理除信任 Node.js 内置证书颁发机构外，还会信任操作系统证书存储（例如 Windows 证书存储或 macOS 钥匙串）。适用于会检查 TLS 的代理；重启 R 会话后生效。
positAssistantTestManifestTitle=使用 Posit Assistant 预发行版（需要重启）
positAssistantTestManifestDescription=使用 Posit Assistant 预发行版进行测试。请勿用于生产工作。
positAssistantUpdateCheckIntervalHoursTitle=Posit Assistant 更新检查间隔（小时）
positAssistantUpdateCheckIntervalHoursDescription=两次检查 Posit Assistant 更新之间的最小间隔小时数。设为 0 表示每次都检查。
copilotEnabledTitle=启用 GitHub Copilot
copilotEnabledDescription=启用后，RStudio 将使用 GitHub Copilot 提供代码建议。
copilotCompletionsTriggerTitle=显示代码建议:
copilotCompletionsTriggerDescription=控制何时在编辑器中显示代码建议。
copilotCompletionsTriggerEnum_auto=自动
copilotCompletionsTriggerEnum_manual=手动（Ctrl + 反斜杠）
copilotCompletionsDelayTitle=GitHub Copilot 代码补全延迟
copilotCompletionsDelayDescription=光标位置改变后，等待多少毫秒再请求 GitHub Copilot 代码补全。
copilotTabKeyBehaviorTitle=按 Tab 键将倾向于插入 :
copilotTabKeyBehaviorDescription=当 Copilot 代码建议和 RStudio 代码补全同时可见时，控制 Tab 键的行为。
copilotTabKeyBehaviorEnum_suggestion=Copilot 建议
copilotTabKeyBehaviorEnum_completions=代码补全
copilotIndexingEnabledTitle=使用 GitHub Copilot 索引项目文件
copilotIndexingEnabledDescription=启用后，RStudio 将使用 GitHub Copilot 索引项目文件。
copilotNesEnabledTitle=启用下一步编辑建议
copilotNesEnabledDescription=启用后，RStudio 会在可用时显示 Copilot 提供的下一步编辑建议。
copilotNesAutoshowTitle=自动显示下次编辑建议
copilotNesAutoshowDescription=启用后，下一步编辑建议会自动显示；禁用后，仅在鼠标悬停于边栏图标上时显示建议。
copilotShowMessagesTitle=显示 GitHub Copilot 的账户和计费消息
copilotShowMessagesDescription=启用后，RStudio 会在消息框中显示 GitHub Copilot 的账户和计费消息。
copilotProjectWorkspaceTitle=使用项目目录作为 Copilot 工作区
copilotProjectWorkspaceDescription=启用后，RStudio 将指示 Copilot 使用当前项目目录作为工作区。
projectNameTitle=
projectNameDescription=用户为当前打开的 R 项目提供的名称。
runBackgroundJobDefaultWorkingDirTitle=后台任务的默认工作目录
runBackgroundJobDefaultWorkingDirDescription=后台任务对话框中的默认工作目录。
runBackgroundJobDefaultWorkingDirEnum_project=项目文件夹
runBackgroundJobDefaultWorkingDirEnum_script=脚本文件夹
codeFormatterTitle=代码格式化工具
codeFormatterDescription=重新格式化代码时使用的格式化工具。
codeFormatterEnum_none=(默认)
codeFormatterEnum_styler=styler
codeFormatterEnum_external=外部工具
codeFormatterStylerStrictTitle=格式化代码时使用严格转换器
codeFormatterStylerStrictDescription=启用后，格式化代码时将使用严格转换器。详情请参阅 `styler` 程序包文档。
codeFormatterExternalCommandTitle=
codeFormatterExternalCommandDescription=重新格式化代码时使用的外部命令。
useAirFormatterTitle=使用 Air 格式化代码
useAirFormatterDescription=设置后，RStudio 在格式化 R 代码时会自动选择并使用合适版本的 Air。
airFormatterRequireTomlTitle=只有在找到 air.toml 文件时才使用 Air
airFormatterRequireTomlDescription=启用后，Air 仅用于格式化位于含有 air.toml 文件的项目或目录中的 R 文档。
reformatOnSaveTitle=保存时重新格式化文档
reformatOnSaveDescription=设置后，保存文档时将使用所选格式化工具重新格式化。
projectUserDataDirectoryTitle=默认项目用户数据目录
projectUserDataDirectoryDescription=RStudio 用于存储项目 .Rproj.user 数据的文件夹。
consoleHighlightConditionsTitle=对以下内容使用扩展显示
consoleHighlightConditionsDescription=启用后，将以应用了自定义样式的扩展形式显示 R 错误、警告和消息。
consoleHighlightConditionsEnum_errors_warnings_messages=错误、警告和消息
consoleHighlightConditionsEnum_errors_warnings=仅错误和警告
consoleHighlightConditionsEnum_errors=仅错误
consoleHighlightConditionsEnum_none=(无)
