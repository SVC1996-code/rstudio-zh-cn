# Simplified Chinese locale for RStudio.
# Manually reviewed against the official English and French resources.
actions=操作
addNewTab=为 <i>文件</i> 新建标签页
backForwardParagraph=向后、向前移动一个段落
backToBeginning=移至上一个单词的开头、结尾
backwardToBefore=向前、向后移至字符 <i>x</i> 之前
backwardToCharacter=向前、向后移至字符 <i>x</i>
beginEndRecording=开始、结束将宏录制到<i>寄存器</i>
changeCharacter=修改字符、行
changeCurrentLine=修改当前行
changeText=修改（剪切并插入）文本
changeToEndOfLine=修改至行尾
closeAllTabs=关闭所有标签页
closeTab=关闭标签页
copyPasteRegister=复制到<i>寄存器</i>或从<i>寄存器</i>粘贴
createMark=在光标处创建标记 x
deleteCurrent=删除当前字符、前一个字符
deleteCurrentLine=删除当前行
deleteEndOfLine=删除至行尾
deleteText=删除（剪切）文本
downUp=向下、向上移动（按屏幕行）
evaluateR=执行 R 表达式
exCommands=Ex 命令
firstCharacter=移至上一行、下一行的第一个字符
firstColumn=移至第一列
firstLast=移至行内第一个、最后一个字符
firstLastLine=移至第一行、最后一行
fowardToBeginning=移至下一个单词的开头、结尾
goToLine=转到第 N 行
goToNext=转到下一个、上一个搜索结果
incrementDecrement=递增、递减下一个数字
indentText=缩进文本
indentUnindent=增加、减少行缩进
inserTextBeforeCursor=在光标、行之前插入文本
insertContents=插入<i>文件</i>内容
insertLineAfter=在当前行之后、之前插入一行
insertTextAfterCursor=在光标、行之后插入文本
invertCurrentLine=反转当前行的字母大小写
invertTextCase=反转文本的字母大小写
joinLine=与下一行合并
leaveInsertMode=退出插入模式
macros=宏
matchingBraceBracket=移至匹配的花括号或方括号
motions=向左、向下、向上、向右移动
operatorMotions=操作符移动
operators=操作符
other=其他
pasteAfter=在光标之后、之前粘贴
performOperation=执行<i>操作</i> N 次
previousNextTab=转到上一个、下一个标签页
reflowText=重新排版文本
registers=寄存器
registersAvailable=可用的寄存器有 <strong>-</strong>、<strong>a-z</strong>、<strong>A-Z</strong> 和 <strong>0-9</strong>。使用 <strong>\:registers</strong> 查看当前寄存器内容。
repeatLast=向前、向后重复上一次 f/t 命令
repeatLastOperation=重复上一次操作
replaceCharacter=替换字符
replaceMode=替换（覆盖）模式
replaceSelection=在选区中替换
replaceTextFile=在文件中将<i>文本</i>替换为 <i>rep</i>
replayMacro=重放<i>寄存器</i>中的宏
reselectLast=重新选择上一次选区
saveQuit=保存、保存并退出（不提示）
scrollCurrentLine=滚动当前行至屏幕中央、顶部、底部
scrollDownUp=向下、向上滚动
scrolling=滚动
searchForward=向前、向后搜索<i>文本</i>
searchForwardText=向前、向后搜索光标下的文本
searchFowardWord=向前、向后搜索光标下的单词
searching=搜索
selectCharacter=选择字符、行、块
showHelp=显示光标下主题的帮助
showScreen=显示此帮助页
sortSelectedLines=对所选行排序
switchCase=切换字母大小写
toLineNumber=移至第<i>指定</i>行
toMarkX=移至标记 x
topMiddleBottomScreen=移至屏幕顶部、中部、底部
undoRedo=撤销、重做
unindent=减少文本缩进
upDownScreen=向上、向下移动半屏
yankText=复制文本
yankToEndOfLine=复制至行尾
