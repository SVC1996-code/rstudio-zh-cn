gridHelpHeaderText=每项显示列名及其类型。点击条目可将数据表滚动到该列；固定和排序图标的作用与表头中的相同，漏斗图标用于筛选该列（见下方“筛选”）。对于日期和日期时间列，将鼠标悬停在类型标签上可查看时区。
gridHelpNumericText=数值列以直方图显示有限数值的分布。
gridHelpDateText=日期和日期时间列以直方图显示随时间的分布。
gridHelpCategoryText=不同值较少的因子列和字符列会为每个值绘制一根条形：因子按水平顺序排列，字符按频数从高到低排列。将鼠标悬停在条形上可查看详情。
gridHelpSummaryText=以 [最小值, 最大值] 显示数值或日期/时间的数据范围（同一天内的日期时间范围仅显示一次日期，后接时间范围），或显示因子水平数、不同值的数量；值太多而无法绘图时，还会显示最高频值。对于非常大的字符列，不计算不同值的数量。右侧显示缺失值的百分比。
gridHelpFilterText=漏斗图标用于打开该列的筛选器。数值和日期/时间列可在直方图上拖选范围，也可手动输入；因子、逻辑值和文本列可选择或匹配某个值。调整筛选条件时，数据表会同步更新。点击勾号确认并关闭，点击叉号清除筛选；点击其他位置会保留当前筛选条件。
gridHelpDetailsText=点击三角形可展开详细统计面板，统计结果按需计算；日期时间列还会显示时区。
gridSummaryLoadError=加载摘要时出错
gridSummaryAllMissing=所有值均为缺失值。
gridSummaryUnavailable=此列暂无可用摘要。
